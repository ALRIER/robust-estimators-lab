name: One-time Layer 2 data-world implementation

on:
  push:
    paths:
      - '.github/workflows/one_time_layer2_data_world.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Layer 2 data-world implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Layer 2 patch
        run: python scripts/patch_layer2_data_world.py

      - name: Verify Python syntax
        run: python -m py_compile streamlit_app.py src/data_world.py

      - name: Remove one-time helpers
        run: |
          git rm scripts/patch_layer2_data_world.py
          git rm .github/workflows/one_time_layer2_data_world.yml

      - name: Commit Layer 2 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py src/data_world.py
          git commit -m "Implement Layer 2 data-world views and presenter help"
          git push

# explicit corrected-patch trigger
