name: One-time presenter notes standardization

on:
  push:
    paths:
      - '.github/workflows/one_time_presenter_notes_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run presenter notes standardization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final presenter runtime fix
        run: python scripts/fix_presenter_runtime.py

      - name: Remove one-time patch helpers
        run: |
          rm -f scripts/patch_presenter_notes.py
          rm -f scripts/fix_presenter_patch_quotes.py
          rm -f scripts/fix_presenter_runtime.py
          rm -f .github/workflows/one_time_presenter_notes_patch.yml

      - name: Commit final presenter notes update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finalize presenter notes standardization"
            git push
          fi
