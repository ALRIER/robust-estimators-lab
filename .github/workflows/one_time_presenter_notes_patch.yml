name: One-time presenter notes standardization

on:
  push:
    paths:
      - '.github/workflows/one_time_presenter_notes_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run presenter notes standardization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presenter notes patch
        run: python scripts/patch_presenter_notes.py

      - name: Commit standardized presenter notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Standardize presenter notes across defense layers"
            git push
          fi
