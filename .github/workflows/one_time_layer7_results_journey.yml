name: One-time Layer 7 results journey integration

on:
  push:
    paths:
      - '.github/workflows/one_time_layer7_results_journey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Correct patch target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_layer7_results_journey.py')
          s = p.read_text(encoding='utf-8')
          old = "results_start = text.index('if active_section == \"07 · Results journey\":\\n')"
          new = "results_start = text.index('\\nif active_section == \"07 · Results journey\":\\n') + 1"
          if old not in s:
              raise SystemExit('Layer 7 patch target hotfix not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and verify Layer 7 patch
        shell: bash
        run: |
          set +e
          python scripts/patch_layer7_results_journey.py > /tmp/layer7_patch.log 2>&1
          PATCH_CODE=$?
          if [ $PATCH_CODE -eq 0 ]; then
            python -m py_compile streamlit_app.py src/results_journey.py >> /tmp/layer7_patch.log 2>&1
            PATCH_CODE=$?
          fi
          cat /tmp/layer7_patch.log
          if [ $PATCH_CODE -ne 0 ]; then
            cp /tmp/layer7_patch.log layer7_patch_error.txt
            cp streamlit_app.py layer7_debug_streamlit.py
            git add layer7_patch_error.txt layer7_debug_streamlit.py
            git commit -m "Capture Layer 7 patch debug output"
            git push
            exit $PATCH_CODE
          fi

      - name: Remove one-time helpers
        run: |
          git rm scripts/patch_layer7_results_journey.py
          git rm .github/workflows/one_time_layer7_results_journey.yml
          git rm -f layer7_patch_error.txt layer7_debug_streamlit.py 2>/dev/null || true

      - name: Commit Layer 7 implementation
        run: |
          git add streamlit_app.py src/results_journey.py
          git commit -m "Redesign Layer 7 as self-explaining results journey"
          git push
