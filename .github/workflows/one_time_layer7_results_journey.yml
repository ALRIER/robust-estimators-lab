name: One-time Layer 7 results journey integration

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fix patch selector and apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_layer7_results_journey.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("results_start = text.index('if active_section == \"07 · Results journey\":\\n')", "results_start = text.index('\\nif active_section == \"07 · Results journey\":\\n') + 1", 1)
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/patch_layer7_results_journey.py
          python -m py_compile streamlit_app.py src/results_journey.py
      - name: Clean helpers and diagnostics
        run: |
          git rm scripts/patch_layer7_results_journey.py
          git rm .github/workflows/one_time_layer7_results_journey.yml
          git rm -f layer7_patch_error.txt layer7_debug_streamlit.py layer7_trigger.tmp 2>/dev/null || true
      - name: Commit final Layer 7
        run: |
          git add streamlit_app.py src/results_journey.py
          git commit -m "Redesign Layer 7 as self-explaining results journey"
          git push
