name: One-time Layer 7 results journey integration

on:
  push:
    paths:
      - '.github/workflows/one_time_layer7_results_journey.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Layer 7 results journey integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Layer 7 patch
        run: python scripts/patch_layer7_results_journey.py

      - name: Verify Python syntax
        run: python -m py_compile streamlit_app.py src/results_journey.py

      - name: Remove one-time helpers
        run: |
          git rm scripts/patch_layer7_results_journey.py
          git rm .github/workflows/one_time_layer7_results_journey.yml

      - name: Commit Layer 7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py src/results_journey.py
          git commit -m "Redesign Layer 7 as self-explaining results journey"
          git push

# explicit trigger
