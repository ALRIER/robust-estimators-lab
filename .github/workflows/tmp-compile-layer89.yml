name: tmp-compile-layer89
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Layer 8/9
        run: |
          python -m py_compile src/layer89_pages.py
          python -m py_compile src/data_loader.py
