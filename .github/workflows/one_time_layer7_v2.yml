name: Isolated one-time Layer 7 integration

on:
  push:
    paths:
      - '.github/workflows/one_time_layer7_v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply, verify, and diagnose
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_layer7_results_journey.py')
          s = p.read_text(encoding='utf-8')
          old = "results_start = text.index('if active_section == \"07 · Results journey\":\\n')"
          new = "results_start = text.index('\\nif active_section == \"07 · Results journey\":\\n') + 1"
          print('old selector occurrences:', s.count(old))
          if old not in s:
              raise SystemExit('Could not find the old top-level Layer 7 selector')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
            python scripts/patch_layer7_results_journey.py
            python -m py_compile streamlit_app.py src/results_journey.py
          } > /tmp/layer7_v2.log 2>&1
          CODE=$?
          cat /tmp/layer7_v2.log
          if [ $CODE -ne 0 ]; then
            cp /tmp/layer7_v2.log layer7_v2_error.txt
            git add layer7_v2_error.txt
            git commit -m "Record isolated Layer 7 diagnostic"
            git push
            exit $CODE
          fi
      - name: Clean one-time files
        run: |
          git rm scripts/patch_layer7_results_journey.py
          git rm .github/workflows/one_time_layer7_results_journey.yml
          git rm .github/workflows/one_time_layer7_v2.yml
          git rm -f layer7_patch_error.txt layer7_debug_streamlit.py layer7_trigger.tmp layer7_v2_error.txt 2>/dev/null || true
      - name: Commit final implementation
        run: |
          git add streamlit_app.py src/results_journey.py
          git commit -m "Redesign Layer 7 as self-explaining results journey"
          git push

# diagnostic trigger
