name: One-time Layer 6 GA architecture integration

on:
  push:
    paths:
      - '.github/workflows/one_time_layer6_ga_architecture.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Layer 6 GA architecture integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Layer 6 patch
        run: python scripts/patch_layer6_ga_architecture.py

      - name: Verify Python syntax
        run: python -m py_compile streamlit_app.py src/thesis_ga_architecture.py src/experiment_pipeline.py

      - name: Remove one-time helpers
        run: |
          git rm scripts/patch_layer6_ga_architecture.py
          git rm .github/workflows/one_time_layer6_ga_architecture.yml

      - name: Commit Layer 6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py src/thesis_ga_architecture.py src/experiment_pipeline.py
          git commit -m "Implement Layer 6 thesis GA architecture and evidence facts"
          git push

# explicit trigger
